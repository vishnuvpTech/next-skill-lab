{% extends 'base.html' %}
{% block title %}Analysing… — TalentLens{% endblock %}
{% block body %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;">
  <div class="scoring-loader">
    <div class="spinner"></div>
    <div style="font-family:'Clash Display',sans-serif;font-size:1.3rem;margin-bottom:8px;color:var(--bright);">Analysing your responses…</div>
    <div style="font-size:.85rem;color:var(--muted);">Our AI is reviewing your interview. This takes a few seconds.</div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
// Redirect to results after brief pause (server-side scoring)
setTimeout(() => {
  location.href = "{% url 'interview_results' resp.id %}";
}, 1500);
</script>
{% endblock %}
